{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="panel detail-panel profile-single">
    <div class="panel-heading"><div><span class="eyebrow">SECURITY</span><h2>Change password</h2></div></div>
    <form method="post" action="{{ url_for('change_password') }}" class="form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
        <label for="new_password">New password (at least 8 characters)</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
        <button class="button button-primary" type="submit">Change password</button>
    </form>
    <p class="muted">Use a unique password. Staff can reset your password if you forget it — contact the barangay office.</p>
    <p class="muted"><a href="{{ url_for('profile_page') }}"><i data-lucide="arrow-left" class="inline-icon"></i> Back to My profile</a></p>
</section>
{% endblock %}
